name: dengue_zero
description: "DengueZero: app educativo de combate ao mosquito da dengue."
publish_to: 'none'

# 1.0.0+1 era a versão do APK original. 1.1.0 recriou o app sem as Missões de
# Algoritmo e com o guia "Como Jogar". 1.2.0 sorteia partidas de 12 perguntas
# de um banco de 36 e embaralha as alternativas.
version: 1.2.0+3

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quiz/perguntas.json
    - assets/assistente/dicas.json
